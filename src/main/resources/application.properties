# Server Configuration
server.port=8081

# H2 Database Configuration (for development/testing)
#spring.datasource.url=jdbc:h2:mem:testdb
#spring.datasource.driverClassName=org.h2.Driver
#spring.datasource.username=sa
#spring.datasource.password=password
#spring.jpa.database-platform=org.hibernate.dialect.H2Dialect
#spring.jpa.open-in-view=false

# PostgreSQL Database Configuration (Production)
spring.datasource.url=${DATABASE_URL}
spring.datasource.driverClassName=org.postgresql.Driver
spring.datasource.username=${DB_USER}
spring.datasource.password=${DB_PASSWORD}

# Enable H2 Console (only for development)
spring.h2.console.enabled=true
spring.h2.console.path=/h2-console
spring.h2.console.settings.web-allow-others=true

# JPA/Hibernate Configuration
spring.jpa.show-sql=true
spring.jpa.hibernate.ddl-auto=update
spring.jpa.format-sql=true

# JSON Configuration
spring.jackson.serialization.fail-on-empty-beans=false
spring.jackson.serialization.write-dates-as-timestamps=false
spring.jackson.default-property-inclusion=non_null

# Actuator Configuration
management.endpoints.web.exposure.include=*
management.endpoint.health.show-details=always

# DevTools Configuration
spring.devtools.restart.enabled=true

# Datadog Configuration
management.datadog.metrics.export.enabled=true
management.datadog.metrics.export.api-key=${DD_API_KEY}
management.datadog.metrics.export.application-key=${DD_APP_KEY}
management.datadog.metrics.export.uri=https://api.datadoghq.com
management.datadog.metrics.export.step=10s

# ==========================================
# IMAGE ANALYSIS APIs CONFIGURATION
# ==========================================

# OCR.space API Configuration
ocr.api.key=${OCR_API_KEY}
ocr.api.url=${OCR_API_URL}

# APILayer Image Labeling API Configuration
image.labeling.api.key=${APILAYER_API_KEY}
image.labeling.api.url=${APILAYER_API_URL}

# Image Processing Configuration
image.processing.enabled=true
image.processing.ocr.confidence.threshold=0.7
image.processing.labeling.confidence.threshold=0.5
image.processing.timeout.seconds=30
image.processing.retry.attempts=3

# ==========================================
# LOGGING CONFIGURATION
# ==========================================

# Root logging level
logging.level.root=INFO

# Application specific logging
logging.level.ar.edu.utn.dds.k3003=DEBUG
logging.level.ar.edu.utn.dds.k3003.service.ImageAnalysisService=DEBUG

# Spring framework logging
logging.level.org.springframework.web.client=DEBUG
logging.level.org.springframework.web=INFO
logging.level.org.springframework.security=INFO

# Database logging
logging.level.org.hibernate.SQL=DEBUG
logging.level.org.hibernate.type.descriptor.sql.BasicBinder=TRACE

# External APIs logging
logging.level.org.apache.http.wire=DEBUG


# ==========================================
# HTTP CLIENT CONFIGURATION
# ==========================================

# RestTemplate timeouts
http.client.connect.timeout=10000
http.client.read.timeout=30000
http.client.connection.request.timeout=5000

